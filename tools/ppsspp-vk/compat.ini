# God of War at 30 frames a second, for the R36S (RK3326) and other slow devices.
#
# Copy this file to the spruce card as
#     Saves/.config/ppsspp/PSP/SYSTEM/compat.ini
# (next to ppsspp.ini; PPSSPP reads it after its own assets/compat.ini). Delete
# it there to get PPSSPP's standard behaviour back. Any PPSSPP build reads it,
# spruce's own included; "Function replacements" must be on (spruce's default).
#
# Both God of War games run with an unlocked frame rate. PPSSPP holds them to
# 60 (GoWFramerateHack60), and has this second hack, off in its compat.ini
# because it is "only an option for users with very weak hardware": the game
# then waits two vblanks a frame and asks for 30 frames a second, never more,
# so the emulator has half the frames to run and draw where the game would go
# above 30. It is what dArkOSen's "Force 30 FPS" PPSSPP option does for these
# games. PPSSPP: "not universal, will not work for games simply added to the
# list"; these are the IDs PPSSPP lists for it.

[FramerateHack30]
# God of War: Ghost of Sparta
UCUS98737 = true
UCAS40323 = true
NPHG00092 = true
NPEG00044 = true
NPEG00045 = true
NPJG00120 = true
NPUG80508 = true
UCJS10114 = true
UCES01401 = true
UCES01473 = true
# God of War: Ghost of Sparta, demo
NPEG90035 = true
NPUG70125 = true
NPJG90095 = true
# God of War: Chains of Olympus
UCAS40198 = true
UCUS98653 = true
