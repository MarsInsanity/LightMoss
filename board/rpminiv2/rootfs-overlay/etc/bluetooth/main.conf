# LightMoss (Retroid Pocket Mini V2). What is not set here keeps BlueZ's
# default (bluetoothd's main.conf in the BlueZ sources lists every option).
# ROCKNIX sets the same on its handhelds.

[General]
# What phones and computers list this handheld as: without hostnamed, BlueZ
# would call it "BlueZ 5.79".
Name = Retroid Pocket Mini V2

# Pads and headsets that call back on their own reconnect sooner, for a
# little power while the radio is on.
FastConnectable = true

# A pad or headset paired with another system meanwhile pairs again here
# without a confirmation that nothing on screen could give.
JustWorksRepairing = always

[Policy]
# The adapter comes up powered, ready for spruce's reconnect at boot.
AutoEnable = true
