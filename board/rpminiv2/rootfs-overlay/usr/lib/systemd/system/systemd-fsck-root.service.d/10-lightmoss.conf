# The boot entries mount / read-only with fsck.repair=yes, so the root
# filesystem is checked (and repaired) on every boot. If e2fsck cannot repair
# it, upstream's OnFailure=emergency.target would stop at a root console that
# nobody can reach on this device (no keyboard, no getty on tty1): keep booting
# instead, as LightMoss did before it checked the root at all. systemd-remount-fs
# still remounts / rw, and the failure is in the journal and the debug export.
[Unit]
OnFailure=
