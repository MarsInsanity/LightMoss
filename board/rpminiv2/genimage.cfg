# LightMoss card image for the Retroid Pocket Mini V2: OpenABL (boot source
# Auto or SD card) boots it from the card, and from there it installs itself
# on the internal storage (lightmoss-install-internal).
#
#   p1 LMBOOT  FAT32, Microsoft basic data (a PC mounts it): OpenABL's boot
#              entry, the kernel, the OpenABL image for installing, the flags
#   p2 LMSYS   ext4: the system
#   first boot p3 SPRUCEOS exFAT in the rest of the card (lightmoss-firstboot)
#
# Fixed partition UUIDs, "LMSD": the boot entry finds the system by
# root=PARTUUID, and the internal storage's copies get UUIDs of their own.

image lmboot.vfat {
	vfat {
		label = "LMBOOT"
		extraargs = "-F 32"
		files = {
			"lmboot/loader",
			"lmboot/lightmoss-sd",
			"lmboot/openabl",
			"lmboot/README-LightMoss.txt"
		}
	}
	size = 256M
}

image lightmoss-rpminiv2.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "4c4d5344-0000-4000-8000-000000000000"
	}

	partition LMBOOT {
		partition-type-uuid = "F"
		partition-uuid = "4c4d5344-0000-4000-8000-000000000001"
		bootable = true
		image = "lmboot.vfat"
		offset = 1M
	}

	partition LMSYS {
		partition-type-uuid = "L"
		partition-uuid = "4c4d5344-0000-4000-8000-000000000002"
		image = "rootfs.ext4"
	}
}
