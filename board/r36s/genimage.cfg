# LightMoss disk image for the R36S clone (G80CA). The same image goes on a
# TF1 card or on the internal eMMC.
#
#   sector     64  idbloader.img (DDR init + miniloader), raw
#   sector  16384  uboot.img, raw
#   sector  24576  trust.img (ATF), raw
#   sector  32768  p1 BOOT  FAT32: Image, dtbs, uboot.dtb, boot.ini, logo
#   after          p2 rootfs ext4
#   first boot     p3 SPRUCEOS exFAT in the remaining space (lightmoss-firstboot)

image boot.vfat {
	vfat {
		label = "BOOT"
		extraargs = "-F 32"
		files = {
			"Image",
			"rk3326-r36sclone-linux.dtb",
			"rk3326-r36sclone-panel9-linux.dtb",
			"uboot.dtb",
			"uboot-panel9.dtb",
			"boot/boot.ini",
			"boot/logo.bmp",
			"boot/battery_0.bmp",
			"boot/battery_1.bmp",
			"boot/battery_2.bmp",
			"boot/battery_3.bmp",
			"boot/battery_fail.bmp",
			"boot/R36S-PANEL.txt",
			"boot/README-LightMoss.txt"
		}
	}
	size = 64M
}

image lightmoss-r36s.img {
	hdimage {
		partition-table-type = "mbr"
		# PARTUUID=4c4d3336-0N in boot.ini ("LM36")
		disk-signature = 0x4c4d3336
	}

	partition idbloader {
		in-partition-table = false
		image = "idbloader.img"
		offset = 32K
	}

	partition uboot {
		in-partition-table = false
		image = "uboot.img"
		offset = 8M
	}

	partition trust {
		in-partition-table = false
		image = "trust.img"
		offset = 12M
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
