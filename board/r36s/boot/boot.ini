odroidgoa-uboot-config

# LightMoss boot script for the R36S clone (G80CA-MB), run by U-Boot's cfgload.
#
# ${bootdev} is the mmc this file was read from: 1 = the TF1 card, 0 = the
# internal eMMC (LightMoss's U-Boot tries TF1 first). Older U-Boots that do not
# set it only ever read TF1.
if test -z "${bootdev}"; then setenv bootdev "1"; fi

# U-Boot's panel-ID check leaves panel_node at panel@8 or panel@9 (or
# uboot-panel9.dtb starts it on panel@9); boot the kernel dtb for that panel.
setenv dtb_name "rk3326-r36sclone-linux.dtb"
if test "${panel_node}" = "panel@9"; then setenv dtb_name "rk3326-r36sclone-panel9-linux.dtb"; fi

# root: partition 2 of this disk, by its MBR disk signature (the installer
# gives the eMMC copy its own and rewrites this line there).
# cgroup: systemd 257 on the 4.4 kernel runs the v1 hierarchy, which it only
# does when both of these are on the command line.
setenv bootargs "root=PARTUUID=4c4d3336-02 rootwait rw fsck.repair=yes net.ifnames=0 fbcon=rotate:0 console=ttyFIQ0 quiet splash loglevel=3 consoleblank=0 vt.global_cursor_default=0 usbcore.autosuspend=-1 systemd.unified_cgroup_hierarchy=0 SYSTEMD_CGROUP_ENABLE_LEGACY_FORCE=1 systemd.show_status=0 systemd.getty_auto=0 panel_id=${panel_id} panel_node=${panel_node}"

# An empty file named "lightmoss-debug" on this partition: kernel and systemd
# text on the screen, and the logs exported here (see README-LightMoss.txt).
if test -e mmc ${bootdev}:1 /lightmoss-debug; then setenv bootargs "${bootargs} console=tty0 loglevel=7 systemd.show_status=1 lightmoss.debug"; fi

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"

load mmc ${bootdev}:1 ${loadaddr} Image
load mmc ${bootdev}:1 ${dtb_loadaddr} ${dtb_name}

booti ${loadaddr} - ${dtb_loadaddr}
