odroidgoa-uboot-config

# LightMoss boot script for the R36S clone (G80CA-MB), run by U-Boot's cfgload.
#
# ${bootdev} is the mmc this file was read from: 1 = the TF1 card, 0 = the
# internal eMMC (LightMoss's U-Boot tries TF1 first). Older U-Boots that do not
# set it only ever read TF1.
if test -z "${bootdev}"; then setenv bootdev "1"; fi

setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x01f00000"
setenv initrd_loadaddr "0x04000000"

# The kernel: 4.4, unless an empty file named "lightmoss-kernel-5.10" is on
# this partition (the LightMoss Kernel app in spruce makes it), which starts
# the optional BSP 5.10 kernel instead (Image-5.10 and its dtbs; the Mali g29p1
# blob, with Vulkan). Without Image-5.10 the file is ignored.
# Each 5.10 start is a try: this writes lightmoss-kernel-5.10-trying first,
# and LightMoss removes it once spruce is up on 5.10 (lightmoss-kernel-ok). If
# it is still there, the last 5.10 start never got to spruce: this start is
# 4.4, and stays so until the app (or deleting the file) asks for another try.
# If the marker cannot be written, 4.4 starts too.
setenv lm_kernel ""
setenv lm_kernel_args ""
if test -e mmc ${bootdev}:1 /lightmoss-kernel-5.10; then
	if test -e mmc ${bootdev}:1 /Image-5.10; then
		if test -e mmc ${bootdev}:1 /lightmoss-kernel-5.10-trying; then
			echo "LightMoss: the last 5.10 start did not get to spruce; starting 4.4"
		else
			mw.b ${initrd_loadaddr} 0x31 1
			if fatwrite mmc ${bootdev}:1 ${initrd_loadaddr} lightmoss-kernel-5.10-trying 1; then setenv lm_kernel "-5.10"; setenv lm_kernel_args " max_cpufreq=1512"; fi
		fi
	fi
fi

# U-Boot's panel-ID check leaves panel_node at panel@8 or panel@9 (or
# uboot-panel9.dtb starts it on panel@9); boot the kernel dtb for that panel.
setenv dtb_name "rk3326-r36sclone-linux${lm_kernel}.dtb"
if test "${panel_node}" = "panel@9"; then setenv dtb_name "rk3326-r36sclone-panel9-linux${lm_kernel}.dtb"; fi

# root: partition 2 of this disk, by its MBR disk signature (the installer
# gives the eMMC copy its own and rewrites this line there).
# cgroup: systemd 257 on the 4.4 kernel runs the v1 hierarchy, which it only
# does when both of these are on the command line. rootfstype: the kernel
# would otherwise try ext3 and ext2 on it first.
setenv bootargs "root=PARTUUID=4c4d3336-02 rootfstype=ext4 rootwait rw fsck.repair=yes net.ifnames=0 fbcon=rotate:0 console=ttyFIQ0 quiet splash loglevel=3 consoleblank=0 vt.global_cursor_default=0 usbcore.autosuspend=-1 systemd.unified_cgroup_hierarchy=0 SYSTEMD_CGROUP_ENABLE_LEGACY_FORCE=1 systemd.show_status=0 systemd.getty_auto=0 panel_id=${panel_id} panel_node=${panel_node}"

# 5.10 only: max_cpufreq=1512 makes its kernel set the CPU PLL for 1512 MHz,
# so the CPU runs at the rates spruce's CPU modes ask for (1416 MHz,
# Overclock 1512 MHz) instead of being held at 1248/1296 MHz while cpufreq
# reports them (the dtb's rockchip,boot-max-freq opts in to it).
setenv bootargs "${bootargs}${lm_kernel_args}"

# An empty file named "lightmoss-debug" on this partition: kernel and systemd
# text on the screen, and the logs exported here (see README-LightMoss.txt).
if test -e mmc ${bootdev}:1 /lightmoss-debug; then setenv bootargs "${bootargs} console=tty0 loglevel=7 systemd.show_status=1 lightmoss.debug"; fi

setenv filesize "0"
load mmc ${bootdev}:1 ${loadaddr} Image${lm_kernel}
setenv lm_image_size "${filesize}"
setenv filesize "0"
load mmc ${bootdev}:1 ${dtb_loadaddr} ${dtb_name}
setenv lm_dtb_size "${filesize}"

# Booting from the eMMC: leave a note that U-Boot got this far, for the logs a
# TF1 boot exports (emmc.txt). Raw, 6 MB into the eMMC, an area nothing else
# uses (every update clears it); no filesystem is written.
if test "${bootdev}" = "0"; then mw.b ${initrd_loadaddr} 0 0x800; env export -t ${initrd_loadaddr} bootdev lm_kernel dtb_name panel_id panel_node lm_image_size lm_dtb_size bootargs; mmc dev 0; mmc write ${initrd_loadaddr} 0x3000 0x4; fi

# The updater (uInitrd, a small initramfs) comes along on every start: with
# the charger connected it installs a LightMoss image found as *.rkimg on any
# card (see README-LightMoss.txt), otherwise it starts the system at once. If
# uInitrd is missing or damaged (booti checks it), the kernel starts without
# it, as it always could.
if load mmc ${bootdev}:1 ${initrd_loadaddr} uInitrd; then booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}; fi
booti ${loadaddr} - ${dtb_loadaddr}
