name: build

# Builds the LightMoss images: the R36S clone (G80CA) and the Retroid Pocket
# Mini V2, side by side.
#   - every push: each image is attached to the run as an artifact
#   - a push whose .github/lightmoss-version names a version that has no
#     release yet: both images are also published as that GitHub release (the
#     workflow creates the tag), which is what the LightMoss Update app
#     installs (each device takes the image named for its board). To release,
#     bump that file.
#   - a pushed tag (v1.2.3): published as that release, too
#   - "Run workflow" on the Actions page builds any branch by hand
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# A push while a build runs waits for it (and replaces any older waiting
# one): a cancelled build saves no cache, so cancelling each one on the next
# push left every build starting from nothing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A release build carries its version (os-release, file names);
          # anything else is a development build named after the commit.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"; release=1
          else
            want="$(tr -d ' \r\n' < .github/lightmoss-version 2>/dev/null)"
            if [ -n "$want" ] && ! git rev-parse -q --verify "refs/tags/$want" >/dev/null &&
               ! gh release view "$want" >/dev/null 2>&1; then
              v="$want"; release=1
            else
              v="$(git describe --tags --always)-$(date -u +%Y%m%d)"; release=0
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version: $v (release: $release)"

  image:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: [r36s, rpminiv2]
    env:
      BOARD: ${{ matrix.board }}
      # Keep buildroot's downloads and ccache where actions/cache can find them.
      BR2_DL_DIR: ${{ github.workspace }}/dl
      BR_CACHE_DIR: ${{ github.workspace }}/ccache
      # Where the LightMoss Update app looks for releases (os-release).
      LIGHTMOSS_REPO: ${{ github.repository }}
      LIGHTMOSS_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Free disk space
        run: |
          # A buildroot build needs ~20 GB; the runner's preinstalled SDKs take most of it.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/julia* /opt/az
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential rsync cpio bc unzip wget file \
                                      python3 git xz-utils qemu-user-static

      # The R36S keeps its output directory (output/); other boards build in
      # output-<board>/ (see the Makefile).
      - name: Output directory
        run: |
          if [ "$BOARD" = r36s ]; then o=output; else o="output-$BOARD"; fi
          echo "OUT=$o" >> "$GITHUB_ENV"

      # Restored here, saved after the build even when it fails: a failed
      # build's downloads and compiler cache still spare the next one most
      # of its work.
      - name: Restore downloads
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          # The tarballs only: buildroot's git caches (the kernel's alone is
          # ~7 GB of history) are rebuilt from scratch when needed.
          path: |
            dl
            !dl/*/git
          key: dl-${{ matrix.board }}-${{ hashFiles(format('configs/lightmoss_{0}_*defconfig', matrix.board), 'Makefile', 'package/**/*.mk') }}
          restore-keys: |
            dl-${{ matrix.board }}-
            dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.board }}-
            ccache-

      - name: Configure
        run: make BOARD="$BOARD" config

      - name: Build
        run: |
          # Print the package being built once a minute; the full log is
          # shown below if the build fails.
          set +e
          make BOARD="$BOARD" > build.log 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 60
            grep -a '^>>> ' build.log | tail -n 1
          done
          wait "$pid"

      - name: Build log
        if: failure()
        run: tail -n 300 build.log

      - name: Save downloads
        if: always() && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            !dl/*/git
          key: dl-${{ matrix.board }}-${{ hashFiles(format('configs/lightmoss_{0}_*defconfig', matrix.board), 'Makefile', 'package/**/*.mk') }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ github.run_id }}

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: lightmoss-${{ matrix.board }}-${{ needs.version.outputs.version }}
          path: |
            ${{ env.OUT }}/images/lightmoss-${{ matrix.board }}-*.img.xz
            ${{ env.OUT }}/images/lightmoss-${{ matrix.board }}-*.img.xz.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, image]
    if: needs.version.outputs.release == '1'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the images
        uses: actions/download-artifact@v4
        with:
          pattern: lightmoss-*-${{ needs.version.outputs.version }}
          path: images
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.version.outputs.version }}
        run: |
          ls -l images
          # Creates the tag on this commit when it does not exist yet.
          gh release create "$V" --target "$GITHUB_SHA" --title "LightMoss $V" --generate-notes \
            images/lightmoss-*.img.xz images/lightmoss-*.img.xz.sha256
